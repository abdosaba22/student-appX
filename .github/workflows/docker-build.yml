name: Direct SSH Deployment via GitHub Actions

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Deploy and Build directly on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ec2-user
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "[INFO] Entering project directory..."
            cd /home/ec2-user/student-app
	    
	    echo "[INFO] Configuring Git with Secure Secret Token..."
	    git remote set-url origin https://${{ secrets.GH_TOKEN }}@github.com/abdosaba22/student-appX.git
            
            echo "[INFO] Pulling latest code changes from Git..."
            git pull origin main || (sudo git fetch --all && sudo git reset --hard origin/main)

            echo "[INFO] Building Image locally using Podman..."
            podman build -t localhost/student-appx:latest .

            echo "[INFO] Restarting Container..."
            podman stop app1 || true
            podman rm app1 || true
	    podman run -d --name $APP_NAME -p $APP_PORT:80 -e DB_HOST="host.containers.internal" -e DB_USER=abdo -e DB_PASSWORD=123456 -e DB_NAME=applicationDB $IMAGE

            #podman run -d --name app1 -p 8080:80 -e DB_HOST=172.25.250.10 localhost/student-appx:latest

            echo "[INFO] Deployment over GitHub Actions completed successfully! 🎉"
